<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Void - Space Shooter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui-layer">
        <div id="score-board">SCORE: <span id="score-val">0</span></div>
        <div id="start-screen" class="screen active">
            <h1>NEON VOID</h1>
            <p>Press <span class="key-highlight">SPACE</span> or Click to Start</p>
            <p class="controls">WASD / Arrow Keys to Move • CLICK / SPACE to Shoot</p>
        </div>
        <div id="game-over-screen" class="screen">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">RETRY</button>
        </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
