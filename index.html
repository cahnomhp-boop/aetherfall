<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Aetherfall – All In One</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#05050d;color:#fff;font-family:Segoe UI;overflow:hidden}
canvas{display:block}
#menu,#pause,#cine{
 position:fixed;inset:0;z-index:20;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 background:rgba(0,0,0,.9)
}
#ui,#minimap{
 position:fixed;z-index:10;
 background:rgba(0,0,0,.6);
 padding:10px;border-radius:10px
}
#ui{bottom:10px;left:50%;transform:translateX(-50%);text-align:center}
#minimap{top:10px;left:10px;font-size:12px}
button{
 background:#4a6cff;color:#fff;border:none;
 padding:6px 10px;margin:2px;border-radius:6px
}
</style>
</head>

<body>

<div id="menu">
<h1>AETHERFALL</h1>
<p>2.5D Action RPG</p>
<button onclick="startGame()">START GAME</button>
</div>

<div id="cine" style="display:none"><h2 id="cineText"></h2></div>
<div id="pause" style="display:none"><h2>PAUSED</h2></div>

<div id="ui" style="display:none">
<div id="stats"></div>
<button onclick="skill('fire')">🔥</button>
<button onclick="skill('ice')">❄</button>
<button onclick="dash()">💨</button>
<button onclick="heal()">🧪</button>
</div>

<div id="minimap"></div>

<canvas id="game"></canvas>

<script>
/* =====================================================
   CORE & CANVAS
===================================================== */
const c=document.getElementById("game"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener("resize",resize);

let keys={},started=false,paused=false;
onkeydown=e=>{keys[e.key]=1;if(e.key==="Escape")togglePause()}
onkeyup=e=>keys[e.key]=0;

/* =====================================================
   CAMERA
===================================================== */
let cam={x:0,y:0,shake:0};

/* =====================================================
   CLASS SYSTEM
===================================================== */
const CLASSES={
 knight:{hp:260,atk:35,crit:.15,speed:2.6},
 mage:{hp:180,atk:55,crit:.25,speed:2.9},
 rogue:{hp:200,atk:40,crit:.4,speed:3.6}
};
let classPick=localStorage.classPick||
 prompt("Pilih class: knight / mage / rogue","knight");
localStorage.classPick=classPick;

/* =====================================================
   PLAYER
===================================================== */
let p={
 x:2000,y:2000,
 hp:200,max:200,
 atk:30,crit:.2,
 speed:3,
 dash:0,ifr:0,
 potion:5,sp:0,lv:1
};
Object.assign(p,CLASSES[classPick]);

/* =====================================================
   WORLD
===================================================== */
const SIZE=4000;
let biome="forest",wave=1;
let enemies=[],boss=null;
let fx=[];

/* =====================================================
   AUDIO (SIMPLE BUT SANGAR)
===================================================== */
let AC=null;
function beep(f=120,d=0.15){
 if(!AC)AC=new(AudioContext||webkitAudioContext)();
 let o=AC.createOscillator(),g=AC.createGain();
 o.frequency.value=f;g.gain.value=.05;
 o.connect(g).connect(AC.destination);
 o.start();o.stop(AC.currentTime+d);
}

/* =====================================================
   START & CINEMATIC
===================================================== */
function cinematic(t){
 cine.style.display="flex";cineText.innerText="";
 let i=0,iv=setInterval(()=>{
  cineText.innerText+=t[i++];
  if(i>=t.length){
   clearInterval(iv);
   setTimeout(()=>cine.style.display="none",1200);
  }
 },40);
}
function startGame(){
 menu.style.display="none";
 ui.style.display="block";
 cinematic("The Aether awakens once more...");
 spawnWave();
 started=true;
}

/* =====================================================
   ENEMY & BOSS
===================================================== */
function spawnWave(){
 enemies=[];
 for(let i=0;i<wave+6;i++){
  enemies.push({
   x:Math.random()*SIZE,
   y:Math.random()*SIZE,
   hp:80+wave*20,
   flash:0
  });
 }
 if(wave%4===0)spawnBoss();
}
function spawnBoss(){
 boss={
  x:SIZE/2,y:300,
  hp:800+wave*200,
  phase:1
 };
 cinematic("A corrupted guardian appears!");
}

/* =====================================================
   ACTION
===================================================== */
function skill(type){
 enemies.forEach(e=>{
  let d=Math.hypot(p.x-e.x,p.y-e.y);
  if(d<180){
   let dmg=p.atk*(type==="fire"?2:1);
   if(Math.random()<p.crit){dmg*=2;pop(e.x,e.y,"CRIT")}
   e.hp-=dmg;e.flash=5;
   pop(e.x,e.y,dmg);
   beep(400);
  }
 });
}
function dash(){if(p.dash<=0)p.dash=20}
function heal(){if(p.potion>0){p.potion--;p.hp=p.max;beep(200)}}

/* =====================================================
   UPDATE
===================================================== */
function update(){
 if(!started||paused)return;

 let sp=p.speed+(p.dash>0?4:0);
 if(keys.w||keys.ArrowUp)p.y-=sp;
 if(keys.s||keys.ArrowDown)p.y+=sp;
 if(keys.a||keys.ArrowLeft)p.x-=sp;
 if(keys.d||keys.ArrowRight)p.x+=sp;
 if(p.dash>0)p.dash--;
 if(p.ifr>0)p.ifr--;

 enemies=enemies.filter(e=>{
  let d=Math.hypot(p.x-e.x,p.y-e.y);
  if(d<300){
   e.x+=p.x>e.x?1.4:-1.4;
   e.y+=p.y>e.y?1.4:-1.4;
   if(d<20 && p.ifr<=0){
    p.hp-=1;p.ifr=20;cam.shake=8;
   }
  }
  if(e.hp<=0){p.sp+=10;return false}
  if(e.flash>0)e.flash--;
  return true;
 });

 if(boss){
  let d=Math.hypot(p.x-boss.x,p.y-boss.y);
  boss.x+=p.x>boss.x?1.2:-1.2;
  if(d<35 && p.ifr<=0){
   p.hp-=2;p.ifr=25;cam.shake=15;
  }
  if(boss.hp<=0){
   boss=null;wave++;spawnWave();
  }
 }

 cam.x=p.x-c.width/2+(Math.random()-.5)*cam.shake;
 cam.y=p.y-c.height/2+(Math.random()-.5)*cam.shake;
 cam.shake*=.9;

 if(p.hp<=0){alert("GAME OVER");location.reload()}
}

/* =====================================================
   DRAW
===================================================== */
function draw(){
 ctx.save();
 ctx.translate(-cam.x,-cam.y);

 ctx.fillStyle=biome==="forest"?"#1f4d2f":"#2b1b1b";
 ctx.fillRect(0,0,SIZE,SIZE);

 // shadow
 ctx.fillStyle="rgba(0,0,0,.4)";
 ctx.beginPath();ctx.ellipse(p.x,p.y+18,14,6,0,0,Math.PI*2);ctx.fill();

 // player (2.5D fake)
 ctx.fillStyle="#4fdcff";
 ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();

 enemies.forEach(e=>{
  ctx.fillStyle=e.flash>0?"#fff":"crimson";
  ctx.beginPath();ctx.arc(e.x,e.y,10,0,Math.PI*2);ctx.fill();
 });

 if(boss){
  ctx.fillStyle="purple";
  ctx.beginPath();ctx.arc(boss.x,boss.y,40,0,Math.PI*2);ctx.fill();
 }

 fx=fx.filter(f=>{
  ctx.fillStyle=f.v==="CRIT"?"orange":"yellow";
  ctx.fillText(f.v,f.x,f.y);
  f.y--;return --f.life>0;
 });

 ctx.restore();

 stats.innerText=
 `Class ${classPick} | HP ${Math.floor(p.hp)}/${p.max} | LV ${p.lv} | SP ${p.sp} | Wave ${wave}`;

 minimap.innerText=
 `MAP\nX:${p.x|0}\nY:${p.y|0}\nEnemies:${enemies.length}`;
}

/* =====================================================
   UTIL & LOOP
===================================================== */
function pop(x,y,v){fx.push({x,y,v,life:30})}
function togglePause(){paused=!paused;pause.style.display=paused?"flex":"none"}

(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>

</body>
</html>
