<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Aetherfall 2.5D – FIXED</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Segoe UI,Arial;
}

/* === CANVAS === */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

/* === UI LAYER === */
#menu,#story,#pause,#ui,#shop{
  position:fixed;
  z-index:10;
  background:rgba(0,0,0,.7);
  padding:10px;
  border-radius:8px;
}

#menu,#story,#pause{
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#ui{top:10px;left:10px;font-size:12px}
#shop{bottom:10px;right:10px;display:none}

button{margin:3px;padding:6px 10px}
</style>
</head>

<body>

<div id="menu">
  <h1>AETHERFALL</h1>
  <p>Chronicles of the Realms</p>
  <button onclick="startGame()">Start</button>
</div>

<div id="story" style="display:none">
  <p id="storyText"></p>
  <button onclick="nextStory()">Next</button>
</div>

<div id="pause" style="display:none">
  <h2>Paused</h2>
  <button onclick="resume()">Resume</button>
  <button onclick="location.reload()">Restart</button>
</div>

<div id="ui" style="display:none">
  <div id="stats"></div>
  <button onclick="skill('fire')">🔥 Fire</button>
  <button onclick="skill('ice')">❄ Ice</button>
  <button onclick="skill('light')">⚡ Light</button>
  <button onclick="usePotion()">🧪 Potion</button>
  <div id="quest"></div>
</div>

<div id="shop">
  <h3>Merchant</h3>
  <button onclick="buyPotion()">Potion (20G)</button>
  <button onclick="buySword()">Iron Sword (100G)</button>
  <button onclick="closeShop()">Close</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* ================= STORY ================= */
const story=[
 "Dunia Aetherfall dulunya damai.",
 "Dungeon kuno muncul membawa korupsi.",
 "Para penjaga telah gugur.",
 "Kini, seorang petualang bangkit."
];
let storyIndex=0;

/* ================= STATE ================= */
let started=false,paused=false;

/* ================= THREE CORE ================= */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x223366);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,12,16);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

/* ================= LIGHT ================= */
scene.add(new THREE.AmbientLight(0xffffff,.6));
const sun=new THREE.DirectionalLight(0xffffff,.7);
sun.position.set(10,20,10);
scene.add(sun);

/* ================= GROUND ================= */
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x1e2a4f})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* ================= PLAYER ================= */
const player={
 hp:150,max:150,lv:1,exp:0,gold:50,
 atk:20,def:5,
 cd:{fire:0,ice:0,light:0},
 potion:2,bonus:0,
 mesh:new THREE.Mesh(
  new THREE.CapsuleGeometry(.6,1.2,4,8),
  new THREE.MeshStandardMaterial({color:0x00ffff})
 )
};
player.mesh.position.y=1;
scene.add(player.mesh);

/* ================= MERCHANT ================= */
const merchant={
 mesh:new THREE.Mesh(
  new THREE.BoxGeometry(1,2,1),
  new THREE.MeshStandardMaterial({color:0xffff00})
 )
};
merchant.mesh.position.set(4,1,0);
scene.add(merchant.mesh);

/* ================= ENEMY ================= */
let enemies=[];
function spawnEnemies(){
 enemies.forEach(e=>scene.remove(e.mesh));
 enemies=[];
 for(let i=0;i<4;i++){
  const e={
   hp:80+player.lv*20,
   mesh:new THREE.Mesh(
    new THREE.BoxGeometry(1,1.5,1),
    new THREE.MeshStandardMaterial({color:0xff4444})
   )
  };
  e.mesh.position.set(Math.random()*10-5,0.75,Math.random()*10-5);
  scene.add(e.mesh);
  enemies.push(e);
 }
}
spawnEnemies();

/* ================= PROJECTILE ================= */
let projectiles=[];
function skill(type){
 if(player.cd[type]>0||paused)return;
 const p={
  type,life:100,
  mesh:new THREE.Mesh(
   new THREE.SphereGeometry(.3),
   new THREE.MeshStandardMaterial({
    color:type==="fire"?0xff6600:type==="ice"?0x66ccff:0xffff00
   })
  )
 };
 p.mesh.position.copy(player.mesh.position);
 scene.add(p.mesh);
 projectiles.push(p);
 player.cd[type]=120;
}

/* ================= INPUT ================= */
let keys={};
addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(e.key==="Escape")togglePause();
});
addEventListener("keyup",e=>keys[e.key]=false);

/* ================= UI ACTION ================= */
function usePotion(){
 if(player.potion>0){
  player.potion--;
  player.hp=player.max;
 }
}
function buyPotion(){if(player.gold>=20){player.gold-=20;player.potion++;}}
function buySword(){if(player.gold>=100){player.gold-=100;player.bonus=10;}}
function closeShop(){shop.style.display="none";}

/* ================= FLOW ================= */
function startGame(){
 menu.style.display="none";
 story.style.display="flex";
 storyText.innerText=story[0];
}
function nextStory(){
 storyIndex++;
 if(storyIndex>=story.length){
  story.style.display="none";
  ui.style.display="block";
  started=true;
 }else storyText.innerText=story[storyIndex];
}
function togglePause(){
 paused=!paused;
 pause.style.display=paused?"flex":"none";
}
function resume(){paused=false;pause.style.display="none";}

/* ================= LOOP ================= */
function update(){
 if(!started||paused)return;

 if(keys.w)player.mesh.position.z-=0.25;
 if(keys.s)player.mesh.position.z+=0.25;
 if(keys.a)player.mesh.position.x-=0.25;
 if(keys.d)player.mesh.position.x+=0.25;

 enemies.forEach((e,i)=>{
  e.mesh.lookAt(player.mesh.position);
  e.mesh.position.lerp(player.mesh.position,.002);
  if(e.mesh.position.distanceTo(player.mesh.position)<1.2){
   player.hp-=0.3;
  }
  if(e.hp<=0){
   scene.remove(e.mesh);
   enemies.splice(i,1);
   player.exp+=30;
   player.gold+=10;
  }
 });

 projectiles.forEach((p,i)=>{
  p.mesh.position.z-=0.5;
  p.life--;
  enemies.forEach(e=>{
   if(p.mesh.position.distanceTo(e.mesh.position)<1){
    e.hp-=40+player.bonus;
    scene.remove(p.mesh);
    projectiles.splice(i,1);
   }
  });
  if(p.life<=0){
   scene.remove(p.mesh);
   projectiles.splice(i,1);
  }
 });

 if(player.exp>=100){
  player.exp=0;
  player.lv++;
  player.max+=20;
  player.hp=player.max;
 }

 Object.keys(player.cd).forEach(k=>player.cd[k]>0&&player.cd[k]--);

 if(player.mesh.position.distanceTo(merchant.mesh.position)<2){
  shop.style.display="block";
 }else shop.style.display="none";

 camera.position.x=player.mesh.position.x;
 camera.position.z=player.mesh.position.z+14;
 camera.lookAt(player.mesh.position);

 stats.innerText=
  `HP ${Math.floor(player.hp)}/${player.max} | Lv ${player.lv} | Gold ${player.gold} | Potion ${player.potion}`;

 if(player.hp<=0){
  alert("Game Over");
  location.reload();
 }
}

function loop(){
 requestAnimationFrame(loop);
 update();
 renderer.render(scene,camera);
}
loop();
</script>
</body>
</html>
